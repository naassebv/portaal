<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>NAASSE B.V. – Personeelsdossier</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; line-height: 1.45; color: #222; background: #f6f6f4; margin: 0; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; background: #fff; min-height: 100vh; }
  h1 { font-size: 1.35em; margin: 0 0 4px; }
  h2 { font-size: 1.05em; margin: 26px 0 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  p.small { color: #555; font-size: 0.92em; }
  label { display: block; font-weight: bold; margin: 12px 0 4px; font-size: 0.95em; }
  label .opt { font-weight: normal; color: #777; }
  input[type=text], input[type=email], select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 4px; background: #fff; }
  input[type=file] { width: 100%; font-size: 15px; padding: 6px 0; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .row > div.narrow { flex: 0 0 35%; }
  .help { font-size: 0.85em; color: #666; margin-top: 3px; }
  .err { color: #b00020; font-size: 0.88em; margin-top: 3px; display: none; }
  .invalid input, .invalid select { border-color: #b00020; }
  .invalid .err { display: block; }
  .preview { max-width: 120px; max-height: 80px; margin-top: 6px; border: 1px solid #ddd; display: none; }
  button { width: 100%; margin-top: 26px; padding: 14px; font-size: 17px; background: #1a5fb4; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #888; }
  .box { padding: 14px; border-radius: 4px; margin: 16px 0; }
  .box.info { background: #eef4fb; }
  .box.bad { background: #fdecee; color: #7a0014; }
  .box.good { background: #e8f5e9; color: #1b5e20; }
  #lang { width: auto; float: right; padding: 4px; font-size: 14px; }
  footer { margin-top: 32px; font-size: 0.85em; color: #666; }
  [dir=rtl] #lang { float: left; }
</style>
</head>
<body>
<main>
  <select id="lang" aria-label="Language"></select>
  <h1 data-t="title"></h1>
  <p id="hello" class="small"></p>

  <div id="loading" class="box info" data-t="loading"></div>
  <div id="linkError" class="box bad" style="display:none" data-t="invalidLink"></div>
  <div id="done" class="box good" style="display:none" data-t="done"></div>

  <form id="form" style="display:none" novalidate>
    <p class="small" data-t="intro"></p>

    <h2 data-t="address"></h2>
    <div class="field" data-f="street"><label for="street" data-t="street"></label><input type="text" id="street" name="street" autocomplete="address-line1"><div class="err" data-t="errRequired"></div></div>
    <div class="row">
      <div class="field narrow" data-f="houseNumber"><label for="houseNumber" data-t="houseNumber"></label><input type="text" id="houseNumber" name="houseNumber" inputmode="text"><div class="err" data-t="errRequired"></div></div>
      <div class="field" data-f="postcode"><label for="postcode" data-t="postcode"></label><input type="text" id="postcode" name="postcode" autocomplete="postal-code"><div class="err" data-t="errPostcode"></div></div>
    </div>
    <div class="field" data-f="city"><label for="city" data-t="city"></label><input type="text" id="city" name="city" autocomplete="address-level2"><div class="err" data-t="errRequired"></div></div>
    <div class="field" data-f="country"><label for="country" data-t="country"></label><select id="country" name="country"></select><div class="err" data-t="errRequired"></div></div>
    <div class="field" data-f="nationality"><label for="nationality"><span data-t="nationality"></span> <span class="opt" data-t="optional"></span></label><input type="text" id="nationality" name="nationality"></div>
    <div class="field" data-f="email"><label for="email"><span data-t="email"></span> <span class="opt" data-t="optional"></span></label><input type="email" id="email" name="email" autocomplete="email"><div class="err" data-t="errEmail"></div></div>

    <h2 data-t="bsnBank"></h2>
    <div class="field" data-f="bsn"><label for="bsn"><span data-t="bsn"></span></label><input type="text" id="bsn" name="bsn" inputmode="numeric" autocomplete="off" maxlength="11"><div class="help" data-t="bsnHelp"></div><div class="err" data-t="errBsn"></div></div>
    <div class="field" data-f="iban"><label for="iban" data-t="iban"></label><input type="text" id="iban" name="iban" autocomplete="off" placeholder="NL00 BANK 0123 4567 89"><div class="err" data-t="errIban"></div></div>
    <div class="field" data-f="ibanHolder"><label for="ibanHolder" data-t="ibanHolder"></label><input type="text" id="ibanHolder" name="ibanHolder" autocomplete="name"><div class="err" data-t="errRequired"></div></div>

    <h2 data-t="documents"></h2>
    <div class="field" data-f="idType"><label for="idType" data-t="idType"></label>
      <select id="idType" name="idType">
        <option value="passport" data-t="passport"></option>
        <option value="id_card" data-t="idCard"></option>
        <option value="residence_permit" data-t="residence"></option>
        <option value="other" data-t="otherDoc"></option>
      </select>
    </div>
    <div class="field" data-f="id_front"><label for="id_front" data-t="idFront"></label><input type="file" id="id_front" accept="image/*,application/pdf"><img class="preview" alt=""><div class="err" data-t="errFile"></div></div>
    <div class="field" data-f="id_back" id="backField"><label for="id_back" data-t="idBack"></label><input type="file" id="id_back" accept="image/*,application/pdf"><img class="preview" alt=""><div class="err" data-t="errFile"></div></div>
    <div class="field" data-f="bank_card"><label for="bank_card" data-t="bankCard"></label><input type="file" id="bank_card" accept="image/*,application/pdf"><img class="preview" alt=""><div class="help" data-t="bankCardHelp"></div><div class="err" data-t="errFile"></div></div>
    <div class="field" data-f="bsn_proof"><label for="bsn_proof"><span data-t="bsnProof"></span> <span class="opt" data-t="optional"></span></label><input type="file" id="bsn_proof" accept="image/*,application/pdf"><img class="preview" alt=""></div>

    <div id="formError" class="box bad" style="display:none"></div>
    <button type="submit" id="submit" data-t="submit"></button>
    <p class="small" data-t="safety"></p>
  </form>

  <footer><a href="privacy.html" data-t="privacy"></a> · NAASSE B.V., Rotterdam</footer>
</main>

      iban: "Банківський рахунок (IBAN)", ibanHolder: "Ім'я власника рахунку",
      documents: "Документи", idType: "Тип документа", passport: "Паспорт", idCard: "ID-картка", residence: "Дозвіл на проживання", otherDoc: "Інше",
      idFront: "Фото документа – лицьовий бік (сторінка з фото)", idBack: "Фото документа – зворотний бік", bankCard: "Фото банківської картки",
      bankCardHelp: "Ім'я та номер рахунку мають бути читабельними. Номер картки можна закрити.", bsnProof: "Підтвердження BSN (лист або документ)",
      submit: "Надіслати захищено", sending: "Надсилання…", safety: "Не надсилайте ці документи через WhatsApp.",
      done: "Дякуємо, ми отримали ваші дані та документи. Цю сторінку можна закрити.",
      errRequired: "Заповніть це поле.", errPostcode: "Перевірте індекс (наприклад 3065 GL).", errEmail: "Перевірте адресу е-пошти.",
      errBsn: "BSN неправильний. Перевірте 9 цифр.", errIban: "IBAN неправильний. Перевірте номер.",
      errFile: "Додайте чітке фото (JPG, PNG) або PDF, до 8 МБ.", errGeneral: "Не все заповнено правильно. Перевірте червоні поля.",
      errServer: "Не вдалося надіслати. Спробуйте за кілька хвилин.", privacy: "Заява про конфіденційність"
    }
  };
  // Twi en Pidgin: Engelse teksten (te weinig zekerheid over goede vertalingen voor formulieren).
  T.tw = T.en; T.pcm = T.en;
  var LANG_NAMES = { en: "English", nl: "Nederlands", ro: "Română", ar: "العربية", fr: "Français", es: "Español", pt: "Português", uk: "Українська", tw: "Twi", pcm: "Pidgin" };
  var COUNTRIES = [["NL","Nederland"],["BE","België"],["DE","Deutschland"],["PL","Polska"],["RO","România"],["BG","България"],["PT","Portugal"],["ES","España"],["FR","France"],["IT","Italia"],["GB","United Kingdom"],["GH","Ghana"],["NG","Nigeria"],["GW","Guiné-Bissau"],["GM","The Gambia"],["SN","Sénégal"],["SL","Sierra Leone"],["UA","Україна"],["MA","المغرب"],["OT","Other / Anders"]];

  var token = (location.hash.match(/[#&]t=([A-Za-z0-9_-]{20,})/) || [])[1] || "";
  // Token uit de adresbalk halen, zodat hij niet in de geschiedenis of bij een screenshot blijft staan.
  try { history.replaceState(null, "", location.pathname); } catch (e) {}

  var lang = "en", firstName = "";
  var $ = function (id) { return document.getElementById(id); };

  function t(key) { return (T[lang] && T[lang][key]) || T.en[key] || ""; }
  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    $("hello").textContent = firstName ? t("hello").replace("{name}", firstName) : "";
    $("submit").textContent = t("submit");
  }

  var sel = $("lang");
  Object.keys(LANG_NAMES).forEach(function (code) { var o = document.createElement("option"); o.value = code; o.textContent = LANG_NAMES[code]; sel.appendChild(o); });
  sel.addEventListener("change", function () { lang = sel.value; render(); });
  var csel = $("country");
  COUNTRIES.forEach(function (c) { var o = document.createElement("option"); o.value = c[0]; o.textContent = c[1]; csel.appendChild(o); });

  function toggleBack() { $("backField").style.display = $("idType").value === "passport" ? "none" : ""; }
  $("idType").value = "id_card"; toggleBack();
  $("idType").addEventListener("change", toggleBack);

  ["id_front","id_back","bank_card","bsn_proof"].forEach(function (id) {
    $(id).addEventListener("change", function () {
      var f = $(id).files[0], img = $(id).parentNode.querySelector(".preview");
      if (f && f.type.indexOf("image/") === 0) { img.src = URL.createObjectURL(f); img.style.display = "block"; } else { img.style.display = "none"; }
    });
  });

  // Foto's verkleinen naar max. 2000 px en als JPEG versturen (sneller en kleiner).
  function shrink(file) {
    return new Promise(function (resolve) {
      if (!file || file.type.indexOf("image/") !== 0 || file.type === "image/gif") return resolve(file);
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 2000, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { resolve(b || file); }, "image/jpeg", 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function bsnOk(v) {
    v = v.replace(/\D/g, ""); if (v === "") return true; if (v.length === 8) v = "0" + v; if (v.length !== 9) return false;
    var s = 0; for (var i = 0; i < 8; i++) s += Number(v[i]) * (9 - i); s -= Number(v[8]); return s % 11 === 0 && s !== 0;
  }
  function ibanOk(v) {
    v = v.replace(/\s+/g, "").toUpperCase(); if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(v)) return false;
    if (v.indexOf("NL") === 0 && v.length !== 18) return false;
    var r = v.slice(4) + v.slice(0, 4), rem = 0;
    for (var i = 0; i < r.length; i++) { var ch = r[i], d = ch >= "A" && ch <= "Z" ? String(ch.charCodeAt(0) - 55) : ch; for (var j = 0; j < d.length; j++) rem = (rem * 10 + Number(d[j])) % 97; }
    return rem === 1;
  }

  function mark(fields) {
    document.querySelectorAll(".field").forEach(function (el) { el.classList.toggle("invalid", fields.indexOf(el.getAttribute("data-f")) >= 0); });
  }
  function checkLocal() {
    var bad = [], v = function (id) { return $(id).value.trim(); };
    if (v("street").length < 2) bad.push("street");
    if (!/^\d+/.test(v("houseNumber"))) bad.push("houseNumber");
    if ($("country").value === "NL" ? !/^\d{4}\s?[A-Za-z]{2}$/.test(v("postcode")) : v("postcode").length < 3) bad.push("postcode");
    if (v("city").length < 2) bad.push("city");
    if (v("email") && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v("email"))) bad.push("email");
    if (!bsnOk(v("bsn"))) bad.push("bsn");
    if (!ibanOk(v("iban"))) bad.push("iban");
    if (v("ibanHolder").length < 2) bad.push("ibanHolder");
    if (!$("id_front").files[0]) bad.push("id_front");
    if ($("idType").value !== "passport" && !$("id_back").files[0]) bad.push("id_back");
    if (!$("bank_card").files[0]) bad.push("bank_card");
    return bad;
  }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    $("formError").style.display = "none";
    var bad = checkLocal(); mark(bad);
    if (bad.length) { $("formError").textContent = t("errGeneral"); $("formError").style.display = "block"; return; }
    var btn = $("submit"); btn.disabled = true; btn.textContent = t("sending");
    var fd = new FormData();
    fd.append("token", token);
    ["street","houseNumber","postcode","city","country","nationality","email","bsn","iban","ibanHolder","idType"].forEach(function (k) { fd.append(k, $(k).value.trim()); });
    var kinds = ["id_front","bank_card","bsn_proof"]; if ($("idType").value !== "passport") kinds.push("id_back");
    Promise.all(kinds.map(function (k) { return shrink($(k).files[0]).then(function (b) { if (b) fd.append(k, b, k + (b.type === "application/pdf" ? ".pdf" : ".jpg")); }); }))
      .then(function () { return fetch(API, { method: "POST", body: fd, credentials: "omit", referrerPolicy: "no-referrer" }); })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        if (res.status === 200) { $("form").style.display = "none"; $("done").style.display = "block"; window.scrollTo(0, 0); return; }
        if (res.status === 410) { $("form").style.display = "none"; $("linkError").style.display = "block"; return; }
        if (res.status === 422 && res.body && res.body.fields) {
          var f = res.body.fields.slice();
          if (f.indexOf("file_type") >= 0 || f.indexOf("file_size") >= 0) f.push("id_front", "id_back", "bank_card");
          mark(f); $("formError").textContent = t("errGeneral");
        } else { $("formError").textContent = t("errServer"); }
        $("formError").style.display = "block"; btn.disabled = false; btn.textContent = t("submit");
      })
      .catch(function () { $("formError").textContent = t("errServer"); $("formError").style.display = "block"; btn.disabled = false; btn.textContent = t("submit"); });
  });

  // Start: link controleren.
  var nav = (navigator.language || "en").slice(0, 2); lang = T[nav] ? nav : "en"; sel.value = lang; render();
  if (!token) { $("loading").style.display = "none"; $("linkError").style.display = "block"; return; }
  fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "info", token: token }), credentials: "omit", referrerPolicy: "no-referrer" })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (res) {
      $("loading").style.display = "none";
      if (res.status !== 200) { $("linkError").style.display = "block"; return; }
      firstName = res.body.firstName || "";
      if (res.body.language && T[res.body.language]) { lang = res.body.language; sel.value = lang; }
      render(); $("form").style.display = "block";
    })
    .catch(function () { $("loading").style.display = "none"; $("formError").textContent = t("errServer"); $("formError").style.display = "block"; });
})();
</script>
</body>
